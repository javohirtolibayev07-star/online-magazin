<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Magazin</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }
        .header {
            background: #1f2937;
            color: white;
            padding: 20px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 28px;
            font-weight: bold;
        }
        .nav {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .nav a {
            color: white;
            text-decoration: none;
            font-size: 18px;
        }
        .cart-btn {
            background: #f59e0b;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
        }
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }
        .card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }
        .card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }
        .card-body {
            padding: 18px;
        }
        .card h3 {
            margin: 0 0 10px;
            font-size: 24px;
        }
        .price {
            font-size: 22px;
            color: #059669;
            font-weight: bold;
            margin: 10px 0;
        }
        .card p {
            color: #666;
            margin-bottom: 15px;
        }
        .btn {
            display: inline-block;
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">Magazin</div>
        <div class="nav">
            <a href="/">Bosh sahifa</a>
            <a href="/cart" class="cart-btn">Savat ({{ cart_count }})</a>
        </div>
    </div>

    <div class="container">
        <h1>Mahsulotlar</h1>
        <div class="products">
            {% for product in products %}
            <div class="card">
                <img src="{{ product.image }}" alt="{{ product.name }}">
                <div class="card-body">
                    <h3>{{ product.name }}</h3>
                    <div class="price">{{ product.price }} so'm</div>
                    <p>{{ product.description }}</p>
                    <a href="/add/{{ product.id }}" class="btn">Savatga qo'shish</a>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
